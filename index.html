<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de criaturas (motor-rs)</title>
<style>
  :root { color-scheme: dark; --bg:#14161b; --card:#1f2229; --line:#2e323c; --txt:#e6e8ee; --muted:#9aa1ad; --acc:#7cc4ff; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:20px 24px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 4px; font-size:22px; }
  header p { margin:0; color:var(--muted); font-size:14px; }
  main { padding:24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; display:flex; flex-direction:column; align-items:center; }
  .visor { width:100%; height:320px; background:#0d0f13; border-radius:8px; display:flex; align-items:center; justify-content:center; }
  .visor img { max-width:100%; max-height:100%; image-rendering:pixelated; }
  .info { margin-top:12px; text-align:center; }
  .info .name { font-weight:600; font-size:17px; }
  .info .sub { font-size:13px; color:var(--muted); margin-top:2px; }
  .estado { margin-top:8px; font-size:14px; color:var(--acc); min-height:20px; }
  .controles { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; width:100%; }
  .controles button { flex:1; background:var(--bg); border:1px solid var(--line); color:var(--txt); padding:8px 10px; border-radius:8px; cursor:pointer; font-size:14px; }
  .controles button:hover { border-color:var(--acc); color:var(--acc); }
  .error { color:#ff8a8a; }
</style>
</head>
<body>
<header>
  <h1>Catálogo de criaturas (motor-rs)</h1>
  <p id="resumen">Cargando catálogo…</p>
</header>
<main>
  <section id="galeria" class="grid"></section>
</main>

<script>
(() => {
  // Orden de giro de la dirección (rotar avanza en este orden)
  const DIRS = ['S', 'SE', 'E', 'NE', 'N', 'NW', 'W', 'SW'];
  // Animación por defecto: la primera de esta lista que tenga el personaje
  // (los zombis no tienen "quieto", tienen "zombi_quieto")
  const ANIM_PREFERIDAS = ['quieto', 'zombi_quieto', 'neutra'];
  // Tiempo entre cambios de dirección en la rotación automática
  const INTERVALO_ROTACION_MS = 1000;

  const galeria = document.getElementById('galeria');
  const resumen = document.getElementById('resumen');

  // Crea un elemento con clase y texto (textContent, no innerHTML, para datos del JSON)
  function el(tag, cls, texto) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (texto !== undefined) e.textContent = texto;
    return e;
  }

  function crearTarjeta(p) {
    const animNombres = Object.keys(p.animaciones);
    // Estado de la tarjeta: animación actual y dirección actual (índice)
    const animDefault = ANIM_PREFERIDAS.find(a => animNombres.includes(a)) ?? animNombres[0];
    let animIdx = animNombres.indexOf(animDefault);
    let dirIdx = 0;
    let pausada = false;

    const img = el('img');
    img.alt = p.id;
    const visor = el('div', 'visor');
    visor.append(img);

    const nombre = el('div', 'name', p.id);
    const sub = el('div', 'sub', `${p.criatura} · ${p.skin}`);
    const info = el('div', 'info', undefined);
    info.append(nombre, sub);

    const estado = el('div', 'estado');

    const btnPausa = el('button', null, 'Pausar');
    const btnDir = el('button', null, 'Girar');
    const btnAnim = el('button', null, 'Cambiar animación');
    const controles = el('div', 'controles');
    controles.append(btnPausa, btnDir, btnAnim);

    const card = el('div', 'card');
    card.append(visor, info, estado, controles);

    function actualizar() {
      const anim = animNombres[animIdx];
      const dir = DIRS[dirIdx];
      img.src = p.animaciones[anim][dirIdx];
      img.alt = `${p.id} ${anim} ${dir}`;
      estado.textContent = `${anim} · ${dir}`;
    }

    btnDir.addEventListener('click', () => {
      dirIdx = (dirIdx + 1) % DIRS.length;
      actualizar();
    });

    btnAnim.addEventListener('click', () => {
      animIdx = (animIdx + 1) % animNombres.length;
      actualizar();
    });

    // Rotación automática: avanza de dirección sola, salvo que esté pausada
    btnPausa.addEventListener('click', () => {
      pausada = !pausada;
      btnPausa.textContent = pausada ? 'Reanudar' : 'Pausar';
    });

    setInterval(() => {
      if (pausada) return;
      dirIdx = (dirIdx + 1) % DIRS.length;
      actualizar();
    }, INTERVALO_ROTACION_MS);

    actualizar();
    return card;
  }

  fetch('catalogo.json')
    .then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      return r.json();
    })
    .then(datos => {
      resumen.textContent = `${datos.length} personajes. La dirección rota sola; podés pausarla o cambiar la animación con los botones de cada uno.`;
      datos.forEach(p => galeria.append(crearTarjeta(p)));
    })
    .catch(err => {
      resumen.textContent = `No se pudo cargar catalogo.json (${err.message}). Abrí la página desde un servidor, no con file://.`;
      resumen.classList.add('error');
    });
})();
</script>
</body>
</html>
